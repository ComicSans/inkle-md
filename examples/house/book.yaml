title: { de: Das Haus hinter dem Moor, en: The House Behind the Moor }
blurb:
  de: "Der Wagen bleibt im Regen liegen, und das einzige Licht weit und breit brennt hinter genau einem Fenster. Der Hausherr bittet zu Tisch, der Butler bittet, den Keller zu meiden - und die Nacht wird lang. Ein Schauerspielbuch über Höflichkeit, Neugier und die Frage, wie viel Angst ein Herz aushält."
  en: "The car dies in the rain, and the only light for miles burns behind exactly one window. The master invites you to dinner, the butler asks you to avoid the cellar - and the night runs long. A gothic gamebook about politeness, curiosity, and how much fear one heart can hold."
author: Story Weaver
version: 0.3.0
start: arrival.road

languages:
  default: de
  available: [de, en]

chapters:
  - arrival.md
  - house.md
  - ground.md
  - cellar.md

stats:
  skill:    { name: { de: Geschick, en: Skill }, start: "roll(1,6) + 6",  max: start }
  stamina:  { name: { de: Ausdauer, en: Stamina }, start: "roll(2,6) + 12", max: start }
  luck:     { name: { de: Glück, en: Luck },    start: "roll(1,6) + 6",  max: start }
  fear:     { name: { de: Angst, en: Fear }, start: 0, max: 15 }

inventory:
  slots: 8
  start: [lantern, notebook]

items:
  dagger:    { name: { de: Silberdolch, en: Silver Dagger }, kind: weapon, attack_bonus: 1 }
  kris:      { name: { de: Krummer Opferdolch, en: Curved Sacrificial Dagger }, kind: weapon, attack_bonus: 2, damage_override: 3 }
  coat:      { name: { de: Dein Mantel, en: Your Coat }, kind: armour, defence: 1 }
  poker:     { name: { de: Schürhaken, en: Poker }, kind: weapon }
  lantern:   { name: { de: Sturmlaterne, en: Storm Lantern }, kind: gear }
  notebook:  { name: { de: Notizbuch, en: Notebook }, kind: gear }
  crucifix:  { name: { de: Kruzifix, en: Crucifix }, kind: gear }
  cellar-key: { name: { de: Kellerschlüssel, en: Cellar Key }, kind: gear }
  phial:     { name: { de: Fläschchen ohne Etikett, en: Unlabelled Phial }, kind: gear }
  pie:       { name: { de: Kalte Pastete, en: Cold Pie }, kind: consumable, uses: 1,
               effect: "stamina = min(stamina + 3, stamina_max)",
               when: "not in_combat" }
  brandy:    { name: { de: Flachmann, en: Hip Flask }, kind: consumable, uses: 3,
               effect: "fear = max(fear - 1, 0)" }
  bandage:   { name: { de: Verbandzeug, en: Bandages }, kind: consumable, uses: 2,
               effect: "stamina = min(stamina + 4, stamina_max)",
               when: "not in_combat" }

setup:
  - title: { de: Womit reist du?, en: What do you travel with? }
    pick: 1
    from:
      - { label: { de: Mit einem Silberdolch im Stiefel, en: With a silver dagger in your boot }, item: dagger }
      - { label: { de: Mit einem Flachmann in der Manteltasche, en: With a hip flask in your coat pocket }, item: brandy }
      - { label: { de: Mit Verbandzeug in der Tasche, en: With bandages in your bag }, item: bandage }
  - title: { de: Was steht in deinen Papieren?, en: What do your papers say? }
    pick: 1
    from:
      - { label: { de: Reist in Kurzwaren, en: Travels in haberdashery }, remember: VERTRETER }
      - { label: { de: Repariert Automobile, en: Motor mechanic }, remember: MECHANIKER }
      - { label: { de: Schreibt für den Lokalteil, en: Journalist }, remember: JOURNALIST }

combat:
  attack: "skill + roll(2,6) + weapon_attack"
  damage: "max(weapon_damage, 2) - armour_defence"
  rule: higher-wins
  luck_in_combat: true

enemies:
  # Ein Hund beißt, und was im Keller wartet, hat gar keine Zähne: wer eigene
  # Zeilen schreibt, dem nimmt der Kampf nicht mehr denselben Satz in den Mund.
  hound:
    name: { de: Kettenhund, en: Chained Hound }
    skill: 7
    stamina: 6
    flee_after: 2
    strings:
      combat.hit:   { de: "{&Der Hund weicht zurück, die Kette straff.|Du triffst ihn an der Flanke; er jault auf.}",
                      en: "{&The hound falls back, the chain pulled taut.|You catch it in the flank and it yelps.}" }
      combat.taken: { de: "{&Die Zähne finden deinen Unterarm.|Er reißt dich mit dem Gewicht des Sprungs von den Beinen.}",
                      en: "{&The teeth find your forearm.|The weight of the leap takes your legs from under you.}" }
      combat.down:  { de: "Der Hund liegt still. Die Kette war an nichts befestigt, und jetzt hält ihn auch nichts mehr.",
                      en: "The hound lies still. The chain was fixed to nothing, and now nothing holds him either." }
  servant: { name: { de: Der Diener, en: The Servant }, skill: 8, stamina: 9, flee_after: 4 }
  cultist: { name: { de: Verschlafener Kultist, en: Drowsy Cultist }, skill: 6, stamina: 6, flee_after: 2 }
  thing:
    name: { de: Was im Keller wartet, en: What Waits in the Cellar }
    skill: 9
    stamina: 12
    flee_after: 3
    strings:
      combat.hit:   { de: "{&Etwas gibt nach, wo nichts Festes sein sollte.|Der Schlag geht hinein, tiefer, als er sollte.}",
                      en: "{&Something gives where nothing solid should be.|The blow goes in, deeper than it should.}" }
      combat.taken: { de: "{&Es legt sich um dein Handgelenk, und du bist eine Sekunde lang woanders.|Die Kälte kommt vor dem Schmerz.}",
                      en: "{&It closes on your wrist, and for a second you are somewhere else.|The cold arrives before the pain does.}" }
      combat.tie:   { de: "{&Es wartet ab. Das ist das Schlimmste daran.|Nichts geschieht, und das dauert zu lange.}",
                      en: "{&It waits. That is the worst of it.|Nothing happens, and it takes too long.}" }
      combat.down:  { de: "Es fällt nicht. Es hört auf, da zu sein, und der Kreidekreis steht leer.",
                      en: "It does not fall. It stops being there, and the chalk circle stands empty." }

death:
  when: "stamina <= 0 or fear >= fear_max"
  goto: cellar.undone

undo:
  depth: 10

checks:
  dice: "roll(2,6)"
  succeeds: at-most

strings:
  # Ein Name steht im Nominativ, also steht er als Subjekt im Satz: "Du
  # triffst Der Diener." wäre kaputtes Deutsch, und keine Alternative
  # repariert das.
  combat.hit:   { de: "{enemy} {&steckt deinen Treffer ein|kommt zu spät hinter die Deckung|wankt unter deinem Schlag}.",
                 en: "{enemy} {&takes the blow|is slow behind its guard|reels under your strike}." }
  combat.taken: { de: "{enemy} {&trifft dich|ist schneller als du|erwischt dich an der Schulter}.",
                 en: "{enemy} {&strikes you|is quicker than you are|catches you across the shoulder}." }
  combat.tie:   { de: "{&Ihr weicht einander aus, und nichts geschieht.|Zwei Schläge, beide ins Leere.}",
                 en: "{&You circle each other, and nothing comes of it.|Two blows, and both go wide.}" }
  combat.down:  { de: "{enemy} geht zu Boden und bleibt liegen.",
                 en: "{enemy} goes down and stays down." }
